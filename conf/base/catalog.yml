# Spanish-Hebrew Dictionary Data Catalog - PostgreSQL Version
# All datasets stored in PostgreSQL warehouse for production use

# ============================================================================
# RAW DATA (Input sources)
# ============================================================================

# Download nodes output file paths as strings
es_dump_filepath:
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: raw

he_dump_filepath:
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: raw

en_dump_filepath:
  type: MemoryDataset
  metadata:
    kedro-viz:
      layer: raw

# Tatoeba sentences still in CSV (external source)
tatoeba_sentences:
  type: pandas.CSVDataset
  filepath: data/01_raw/tatoeba-sample.csv
  metadata:
    kedro-viz:
      layer: raw
  load_args:
    sep: '\t'
    header: null
    names: ['id', 'lang', 'text']

# ============================================================================
# INTERMEDIATE DATA - PostgreSQL Warehouse (Harvester pipeline outputs)
# ============================================================================

raw_spanish_entries_unfiltered:
  type: pandas.SQLTableDataset
  table_name: raw_spanish_entries_unfiltered
  credentials: postgres_warehouse
  load_args:
    index_col: id
  save_args:
    index: true
    index_label: id
    if_exists: replace
  metadata:
    kedro-viz:
      layer: intermediate

